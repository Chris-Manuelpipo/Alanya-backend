name: Déploiement VPS (historique — désactivé)

# Déploiement automatique retiré le 2026-08-24 : ce VPS ne sert plus aucun
# trafic applicatif (l'app Flutter ne parle qu'à alanya237.com), mais il
# recevait quand même chaque push et redémarrait son backend. Deux instances
# sur la même base MySQL se disputent `job_queue` : un délai d'appel ou une
# échéance de trajet armé par le serveur qui sert les utilisateurs pouvait
# être consommé par celui-ci, qui n'a pas les sockets correspondantes — la
# cascade partait alors dans le vide.
#
# `workflow_dispatch` conservé pour pouvoir redéployer à la main si ce
# serveur est un jour remis en service.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }} 
          script: |
            cd /var/www/backend
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            npm install --omit=dev
            pm2 restart backend --update-env
            