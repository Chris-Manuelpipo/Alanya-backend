name: Deploiement VPS2 (désactivé)

# En échec à chaque push depuis l'origine : `~/backend` n'existe pas sur cet
# hôte. Déclencheur automatique retiré le 2026-08-24 pour cesser de signaler
# un échec rouge à chaque déploiement légitime.
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS2_HOST }}
          username: ${{ secrets.VPS2_USER }}
          key: ${{ secrets.VPS2_SSH_KEY }}
          port: ${{ secrets.VPS2_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ~/backend
            git pull origin main
            npm install --omit=dev
            pm2 restart backend --update-env